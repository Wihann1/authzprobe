name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # A tool that finds security defects should not ship a repo that has them.
      - name: Fail on vulnerable dependencies
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable dependencies found."
            exit 1
          fi

      - name: Pack
        run: dotnet pack src/AuthzProbe/AuthzProbe.csproj --no-build -c Release

      # The sample API seeds deliberate authorization defects across both minimal APIs
      # and controllers. If the probe stops finding them, the tool is broken even though
      # every unit test passes.
      - name: Probe detects the seeded defects
        run: |
          if dotnet run --project samples/SampleApi -c Release --no-build -f net9.0 -- --probe-only; then
            echo "::error::AuthzProbe reported a clean surface, but the sample seeds real defects."
            exit 1
          else
            echo "Probe correctly failed on the deliberately vulnerable sample."
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: src/AuthzProbe/bin/Release/*.nupkg
          if-no-files-found: error
